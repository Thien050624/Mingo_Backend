server:
  # Render (and most PaaS hosts) assign the port dynamically via $PORT and route traffic
  # there — the app must bind to it instead of a hardcoded port.
  port: ${PORT:8080}
  # NIO2 avoids java.nio.channels.Selector's AF_UNIX-based wakeup pipe, which is broken
  # on this machine's network stack (regular TCP loopback works fine, AF_UNIX does not).
  protocol: org.apache.coyote.http11.Http11Nio2Protocol

spring:
  application:
    name: mingo-backend

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mingo}
    username: ${DB_USERNAME:mingo}
    password: ${DB_PASSWORD:mingo}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-min-32-bytes-long}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  upload:
    dir: ${UPLOAD_DIR:/app/uploads}
    base-url: ${UPLOAD_BASE_URL:http://localhost:8080}
    # Set R2_BUCKET (and the other R2_* vars) in production to switch storage from local disk
    # to Cloudflare R2 — see UploadStorageConfig. Leave unset for local docker-compose dev.

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: INFO
    com.mingo.backend: DEBUG
